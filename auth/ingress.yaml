apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weatherapp-auth-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: weatherapp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: weatherapp-auth
            port:
              number: 8080